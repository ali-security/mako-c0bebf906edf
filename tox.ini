[tox]
envlist = py

[testenv]
cov_args=--cov=mako --cov-report term --cov-report xml

deps=pytest>=3.1.0
     beaker
     markupsafe
     # pygments 2.20+ changed its HTML quote escaping, breaking the exact-output
     # assertions in test/test_exceptions.py; 2.19.x is the last compatible line
     pygments<2.20
     babel
     dogpile.cache
     lingua<4
     cov: pytest-cov

setenv=
    cov: COVERAGE={[testenv]cov_args}

commands=pytest {env:COVERAGE:} {posargs}


[testenv:pep8]
basepython = python3
deps=
      flake8
      flake8-import-order
      flake8-builtins
      flake8-docstrings
      flake8-rst-docstrings
      pydocstyle<4.0.0
      # used by flake8-rst-docstrings
      pygments
      black==22.3.0
commands =
    flake8 ./mako/ ./test/ setup.py --exclude test/templates,test/foo  {posargs}
    black --check .
